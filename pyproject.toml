[project]
name = "attack-copilot"
version = "0.1.0"
description = "RAG over MITRE ATT&CK with a measured eval harness"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "requests>=2.32",
    # Capped: on Windows with Smart App Control on, the brand-new 2.5.x
    # binaries are blocked until they build reputation. 2.4 loads fine.
    "numpy>=2.2,<2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
